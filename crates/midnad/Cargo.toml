[package]
name = "midnad"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "midnad"
path = "src/main.rs"

[dependencies]
midna-proto.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit = "0.25"
libc.workspace = true
libghostty-vt.workspace = true
tiny_http = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-curve25519", "use-sha2", "use-getrandom"] }

# session.input's images (src/images.rs): BMP and TIFF converted to PNG where there's no sips.
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
# The terminal keeper's client: every Windows terminal runs in a midna-pty.exe (src/pty_windows.rs).
midna-pty = { path = "../midna-pty" }
# midnad's own toasts (src/notify_windows.rs), through WinRT: the version the app uses.
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation_Collections"] }

[dev-dependencies]
