[package]
name = "midna-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "midna-app"
path = "src/main.rs"

[features]
default = ["fake-engine"]
# In-process PTY + libghostty-vt engine used by the fake backend (MIDNA_BACKEND=fake),
# so the UI can be exercised without midnad. The real app never needs it.
fake-engine = ["dep:libghostty-vt"]
# `MIDNA_SNAPSHOT=out.png`: draw the main window offscreen and save it, then quit. Works
# while the screen is locked (occluded windows don't draw). Dev only.
snapshot = ["gpui-kit/test-support"]
# Honour the MIDNA_DEBUG_* / updater-override driver env vars in a release build (src/dev.rs).
# Only for test bundles (packaging/e2e); never for a build you ship: those drivers act as the
# human.
dev-drivers = []

[dependencies]
midna-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc.workspace = true
libghostty-vt = { workspace = true, optional = true }
gpui-kit = { version = "0.7", default-features = false }
async-channel = "2"
# install / auto-update (src/install.rs, src/updater.rs)
ureq = { version = "2.12", default-features = false, features = ["tls"] }
ring = "0.17"
base64 = "0.22"
semver = "1"
raw-window-handle = "0.6"
# image annotations (src/annotate.rs): sniff formats and read dimensions; also the snapshot PNG writer
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
# install / auto-update (src/install.rs, src/updater.rs)
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# Kass composer (composer.rs / kass.rs): a native NSTextView in the GPUI window and the
# distributed-notification handshake (spikes/kass-composer).
core-foundation-sys = "0.8"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# native notifications (src/notify.rs)
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent",
    "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger",
    "UNNotificationAttachment", "UNNotificationAction", "UNNotificationCategory",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[dev-dependencies]
# #[gpui_kit::test]: key dispatch through real windows (src/actions.rs)
gpui-kit = { version = "0.7", default-features = false, features = ["test-support"] }
