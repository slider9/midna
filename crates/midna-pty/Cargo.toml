[package]
name = "midna-pty"
version.workspace = true
edition.workspace = true
license.workspace = true

# The keeper, midna-pty.exe: one per Windows terminal, holding its pseudoconsole, shell and job
# so midnad can be replaced while the terminal keeps running. Windows only; elsewhere the library
# has only the platform-neutral protocol and the binary refuses to run.
[lib]
path = "src/lib.rs"

[[bin]]
name = "midna-pty"
path = "src/main.rs"

[[test]]
name = "keeper"
path = "tests/keeper.rs"
harness = false

[dependencies]
midna-proto.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus"] }
